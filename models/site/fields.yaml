# ===================================
#  Form Field Definitions
# ===================================

fields:

    name:
        label: 'Site Name'
        type: text
        span: left
        required: true
    base_url:
        label: 'Site Base Url'
        type: text
        span: right
        required: true
    _toolbar:
        type: partial
        path: ~/modules/backend/behaviors/formcontroller/views/update/fancy/_toolbar.php

secondaryTabs:
    fields:
        image@update:
            label: 'Site Logo'
            type: fileupload
            span: full
            imageWidth: 140
            required: false
        performance_testing@update:
            label: 'Enable Performance Testing'
            type: switch
            span: full
            required: true
        health_testing@update:
            label: 'Enable Health Testing'
            type: switch
            span: full
            required: true

tabs:
    cssClass: master-area
    icons:
        'Lighthouse': 'icon-lightbulb-o'
        'Outages': 'icon-triangle-exclamation'
        'Actions': 'icon-robot'
        'Settings': 'icon-cog'
    fields:
        _urls@update:
            tab: 'Lighthouse'
            type: partial
#        _downsGraph@update:
#            label: Last 7 Outages
#            tab: 'Outages'
#            type: partial
        _downs@update:
            tab: 'Outages'
            type: partial
        _testCreate@update:
            tab: 'Actions'
            type: partial
        _tests@update:
            tab: 'Actions'
            type: partial
        image:
            label: 'Site Logo'
            type: fileupload
            span: left
            imageWidth: 140
            required: false
            tab: 'Settings'
        performance_testing:
            label: 'Enable Performance Testing'
            type: switch
            span: right
            required: true
            tab: 'Settings'
        health_testing:
            label: 'Enable Health Testing'
            type: switch
            span: right
            required: true
            tab: 'Settings'
